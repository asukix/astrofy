<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #1d232a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 0 100px;
    width: 100%;
  }
  .wordmark {
    font-size: 80px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #a6adba;
    line-height: 1;
  }
  .wordmark .arrow {
    color: #a6adba;
    opacity: 0.35;
  }
  .tagline {
    font-size: 22px;
    font-weight: 400;
    color: #a6adba;
    opacity: 0.45;
    margin-top: 20px;
    letter-spacing: 0.01em;
  }
  .divider {
    width: 60px;
    height: 3px;
    background: #a6adba;
    opacity: 0.2;
    margin-top: 36px;
  }
  .url {
    font-size: 18px;
    font-weight: 400;
    color: #a6adba;
    opacity: 0.3;
    margin-top: 20px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="wordmark">SENGDEV<span class="arrow">&gt;</span></div>
    <div class="tagline">iOS engineer · architecture · meta</div>
    <div class="divider"></div>
    <div class="url">sengdev.com</div>
  </div>
</body>
</html>
